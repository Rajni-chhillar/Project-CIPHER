{% extends "admin/admin_base.html" %}
{% block title %}
Add Mission
{% endblock %}
{% block css %}

<link rel="stylesheet" href="{{ url_for('static',filename='css/admin.css') }}">
{% endblock %}
{% block content %}
<div class="admin-page">
    <div class="admin-header">
        <div>
            <p class="admin-eyebrow">
                PROJECT CIPHER / MISSIONS
            </p>
            <h1>
                🗺️ Create New Mission
            </h1>
            <p class="admin-subtitle">
                Create a new investigation for agents.
            </p>
        </div>
    </div>

    <div class="admin-form-card">
        <form method="POST" action="{{ url_for('admin.add_mission') }}">
            <div class="form-group">
                <label>
                    Mission Title
                </label>
                <input type="text"
                    name="title"
                    placeholder="e.g. The Missing Scientist"
                    required>
            </div>

            <div class="form-group">
                <label>
                    Mission Description
                </label>
                <textarea name="description"
                    rows="5"
                    placeholder="Describe the investigation..."
                    required>
                </textarea>
            </div>

            <div class="form-group">
                <label>
                    Difficulty
                </label>
                <select name="difficulty">
                    <option value="Easy">
                        🟢 Easy
                    </option>
                    <option value="Medium" selected>
                        🟡 Medium
                    </option>
                    <option value="Hard">
                        🔴 Hard
                    </option>
                    <option value="Extreme">
                        ☠️ Extreme
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>
                    Reward XP
                </label>
                <input type="number"
                    name="reward_xp"
                    value="500"
                    min="0"
                    required>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('admin.manage_missions') }}"
                    class="cancel-btn">
                    Cancel
                </a>
                <button type="submit"
                    class="save-btn">
                    💾 Save Mission
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
