{% extends "base.html" %}
{% block title %}
Agent Login
{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-box">
        <h1>🔐 Agent Login</h1>
        
        <form method="POST">
            <input type="email"
                name="email"
                placeholder="Email"
                required>
                
            <input type="password"
                name="password"
                placeholder="Secret Password"
                required>
                
            <label>
                <input type="checkbox" name="remember">
                Remember Me
            </label>
            <button>Enter Mission</button>
        </form> 
    </div>
</div>


{% endblock %}
